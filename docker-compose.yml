x-app: &app
  build: .
  image: smartbreaker-app

  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0

    REDIS_URL: redis://redis:6379/1
  volumes:
    - .:/app

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-smartbreaker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # 5433 on the host: 5432 is usually taken by a natively installed Postgres.
    # Inside the compose network the other services still use db:5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-smartbreaker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # web:
  #   <<: *app
  #   command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
  #   ports:
  #     - "8000:8000"
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker -l info
    # `web` applies the migrations. If these start first they may hit missing
    # tables and exit; the restart policy brings them back once web is done.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A config beat -l info
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
